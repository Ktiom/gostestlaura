<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Медицинский тест 26 — 100 вопросов</title>
<style>
:root{--bg:#0f1720;--panel:#16212c;--panel-2:#1c2a37;--accent:#3ba9a0;--accent-2:#2f8a83;--text:#e8eef2;--muted:#8fa3b0;--correct:#2ecc71;--wrong:#e74c3c;--border:#263744}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0f1720,#0b1218);color:var(--text);min-height:100vh}
header{padding:18px 24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;margin:0;font-weight:600}
#scoreBox{font-size:14px;color:var(--muted)}#scoreBox b{color:var(--text)}
.container{max-width:920px;margin:0 auto;padding:20px 16px 60px}
#setup{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:30px;text-align:center;margin-top:40px}
#setup p{color:var(--muted);line-height:1.6}
button{cursor:pointer;border:none;border-radius:8px;font-size:15px;padding:10px 18px;font-weight:600}
button:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#04211d}.btn-primary:hover{background:var(--accent-2)}
.btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
#quizArea,#resultScreen{display:none}
#navGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:18px;max-height:220px;overflow-y:auto}
.navBtn{width:100%;aspect-ratio:1/1;border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--muted);border:1px solid var(--border);padding:0}
.navBtn.current{outline:2px solid var(--accent);color:var(--text)}
.navBtn.answered-correct{background:rgba(46,204,113,.18);color:var(--correct);border-color:var(--correct)}
.navBtn.answered-wrong{background:rgba(231,76,60,.18);color:var(--wrong);border-color:var(--wrong)}
#questionCard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:18px}
#qMeta{color:var(--muted);font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between}
#qText{font-size:18px;line-height:1.5;margin:0 0 18px}
.option{display:flex;align-items:flex-start;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-size:15px;line-height:1.4}
.option:hover{border-color:var(--accent)}
.option .letter{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#0f1a22;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.option.correct{background:rgba(46,204,113,.15);border-color:var(--correct)}.option.correct .letter{background:var(--correct);color:#04210f}
.option.wrong{background:rgba(231,76,60,.15);border-color:var(--wrong)}.option.wrong .letter{background:var(--wrong);color:#2b0a06}
.option.disabled{cursor:default}
#feedback{margin-top:4px;font-weight:600;font-size:14px;min-height:20px}
#feedback.correct{color:var(--correct)}#feedback.wrong{color:var(--wrong)}
#controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#controls .rg{display:flex;gap:10px;margin-left:auto}
.summaryCard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:30px;text-align:center}
.bigScore{font-size:48px;font-weight:700;color:var(--accent);margin:10px 0}
</style></head><body>
<header><h1>🩺 Медицинский тест 26</h1>
<div id="scoreBox">Отвечено: <b id="answeredCount">0</b>/<b id="totalCount">0</b> · Правильно: <b id="correctCount">0</b></div></header>
<div class="container">
<div id="setup"><h2>Тест — 100 вопросов</h2>
<p>Все 100 вопросов в случайном порядке. При каждом новом прохождении порядок вопросов меняется.</p>
<button class="btn-primary" onclick="startQuiz()">Начать тест</button></div>
<div id="quizArea"><div id="navGrid"></div>
<div id="questionCard"><div id="qMeta"><span id="qIndexLabel"></span><span id="qStatusLabel"></span></div>
<p id="qText"></p><div id="optionsList"></div><div id="feedback"></div></div>
<div id="controls"><button class="btn-secondary" id="prevBtn" onclick="goPrev()">← Назад</button>
<div class="rg"><button class="btn-secondary" onclick="finishQuiz()">Завершить тест</button>
<button class="btn-primary" onclick="goNext()">Далее →</button></div></div></div>
<div id="resultScreen"><div class="summaryCard"><h2>Результат теста</h2>
<div class="bigScore" id="finalScoreText"></div><p id="finalPercentText" style="color:var(--muted)"></p>
<button class="btn-primary" onclick="restartQuiz()">Пройти заново (новый порядок)</button>
<button class="btn-secondary" onclick="reviewFromResult()">Просмотреть ответы</button></div></div>
</div>
<script>
const QUESTION_BANK = [{"q": "Как называется документ, в котором отражены основополагающие правила, в соответствии с которыми медицинская сестра может определить, отвечает ли сестринская помощь соответствующему уровню качества?", "options": ["Манипуляционные листы", "Сестринская история болезни", "Лист наблюдения и ухода", "Стандарты сестринского дела", "Нормативно-правовые акты здравоохранения"], "correct": 3}, {"q": "Пациенту назначен анализ мочи на диастазу. Дайте разъяснения пациенту, как правильно собрать мочу на анализ:", "options": ["Среднюю порцию мочи", "В течение суток", "Собрать порционно", "Свежесобранную в теплом виде", "В течение 3 часов"], "correct": 3}, {"q": "В приемное отделение доставлен пациент 58 лет с жалобами на резкую боль в грудной клетке, одышку, выраженную слабость. Кожные покровы бледные, холодный липкий пот. Артериальное давление 90/60 мм.рт.ст., пульс 110 уд/мин. Какое первоочередное действие фельдшера в приемном отделении?", "options": ["Провести санитарную обработку пациента", "Направить пациента в смотровой кабинет", "Немедленно оценить жизненно важные функции и сообщить врачу", "Оформить медицинскую документацию", "Провести забор крови"], "correct": 2}, {"q": "В приемном покое находится несколько пациентов. Кому уделить внимание в первую очередь?", "options": ["Пациентке с диабетом 2 типа, которая обратилась за консультацией по поводу диеты", "Пациенту с диабетом 1 типа с жалобами на наличие язв на внутренней поверхности голени", "Пациенту с диабетом 2 типа с головной болью и с запахом ацетона изо рта", "Пациенту с диабетом 1 типа, который пришел на перевязку после ампутации 1 пальца правой столы", "Пациенту с диабетом 2 типа с жалобами на выделение большого количества мочи"], "correct": 2}, {"q": "В отделении находится мужчина 32 лет с диагнозом облитерирующий эндартериит левой нижней конечности. Сухая гангрена 11 пальцев левой столы. 3 дня назад пациенту была проявидена ампутация. Послеоперационный период протекал без особенностей. Пациент не знает, что делать с культей, считает, что жизнь окончена и он никому не нужен. Какие беседы необходимо включить в план сестринского ухода и наблюдения?", "options": ["беседы о здоровом образе жизни после выписки из стационара", "беседы с пациентом о принципах реабилитации после перенесенной им ампутации пальцев столы", "беседы о правилах самопомощи в домашних условиях", "беседы о сути его заболевания и современных методах его диагностики, лечения, профилактики", "беседы с родственниками об обеспечении усиленного питания пациента"], "correct": 1}, {"q": "Что является основным элементом пропаганды здорового образа жизни?", "options": ["Проведение операций", "Организация вакцинации", "Информирование о вреде", "Выписка лекарств", "Диагностика заболеваний"], "correct": 2}, {"q": "Для сохранения качества резиновых изделий в помещениях какие условия хранения необходимо соблюдать?", "options": ["Защита от света, солнечных лучей", "Защита от низких температур", "Предусматривать попадание текучего воздуха", "Поддерживать влажность воздуха не менее 20%", "Проводить обработку йодом"], "correct": 0}, {"q": "При оказании неотложной помощи пациенту с острой дыхательной недостаточностью фельдшер отметил наличие кашля, высокой температуры и подозрение на инфекционное заболевание, передающееся воздушно-капельным путем. Помощь оказывается в приемном отделении до уточнения диагноза. В данной ситуации какое действие медицинского работника является первым с точки зрения инфекционной безопасности и инфекционного контроля?", "options": ["Немедленно начать кислородотерапию без использования средств индивидуальной защиты", "Оформить медицинскую документацию и вызвать врача", "Провести забор биологического материала для лабораторного исследования", "Изолировать пациента и надеть средства индивидуальной защиты в соответствии с предполагаемым путем передачи инфекции", "Перевести пациента в профильное отделение без предварительных мер защиты"], "correct": 3}, {"q": "В травматологический пункт доставлена женщина 55 лет, которая подскользнулась и упала на левую ногу. При осмотре в области левой голени имеется неглубокая рана размером 15-8 см. загрязнена землей, кровотечения нет, края равны ровные Медицинская сестра произвела первичную обработку раны удалила загрязнения, обработала рану раствором перекиси, высушила, наложила стерильную салфетку и зафиксировала ее. Какой этап обработки раны был пропущен?", "options": ["Обработка краев раны", "Срезание ножницами неровных краев", "Наложение швов", "Дренирование раны", "Салфетка с фурациллином"], "correct": 0}, {"q": "Медсестра при гигиенической обработке рук взяла 3мл антисептика, обработала руки, остаток антисептика высушила бумажным полотенцем и надела стерильные перчатки. В чем ошибка медсестры?", "options": ["Взяла мало антисептика", "Нужно надеть нестерильные перчатки", "Нужно обработать до высыхания антисептика", "Нужно вытирать хлопчатобумажным полотенцем", "Необходимо надевать перчатки без обработки"], "correct": 2}, {"q": "В отделении гнойной хирургии во время смены повязки пациенту с абсцессом бедра, у медицинской сестры порвались перчатки. Определите дальнейшую тактику медицинской сестры.", "options": ["Продолжить работу без перчаток", "Остановить процедуру и заменить перчатки", "Обработать перчатки антисептиком и продолжить процедуру", "Надеть сверху новые перчатки", "Промыть проточной водой и продолжить процедуру"], "correct": 1}, {"q": "Средства, понижающие свертывание крови:", "options": ["Антиоксиданты", "Гипотензивные", "Седативные", "Гемостатики", "Антикоагулянты"], "correct": 4}, {"q": "Фельдшер выписывает рецепт пациенту на таблетки парацетамола по 0,5 г, принимать по 1 таблетке 3 раза в день, всего 10 таблеток. Какой вариант рецепта оформлен наиболее правильны", "options": ["Rp.: Paracetamoli 0,5 D.t.d. №10 in tab. S. По 1 таблетке 3 раза в день", "Rp.: Paracetamolum 0,5 N.10 S. По 1 таблетке 3 раза в день", "Rp.: Tabulettae Paracetamoli 0,5 D.t.d. №10 S. По 1 таблетке 3 раза в день", "Rp.: Paracetamoli D.t.d. №10 S. По 0,5 г 3 раза в день", "Rp.: Paracetamoli 0,5 D.t.d. №10 S. Принимать внутрь"], "correct": 0}, {"q": "Лекарственную зависимость вызывают:", "options": ["психостимуляторы, транквилизаторы, наркотические аналгетики", "седативные средства, наркотические аналгетики, антигистаминные средства", "ноотропные средства, ненаркотические аналгетики, холиномиметики", "аналептики, антигистаминные средства, адреномиметики.", "антигистаминные средства, психостимуляторы, адреноблокаторы"], "correct": 0}, {"q": "Фармакологические эффекты препаратов глюкокортикоидов", "options": ["анаболическое действие, стимуляция роста, стимуляция ССС", "снижение основного обмена, понижение температуры тела, устранение тахикардии", "противовоспалительное, противоаллергическое, иммунодепрессивное действие", "снижение уровия сахара в крови, нормализация жирового и белкового обмена", "угнетение синтеза белков, снижение массы мышечных тканей и паренхиматозных органов"], "correct": 2}, {"q": "Экспираторная одышка отмечается при", "options": ["Абсцессе легкого", "Туберкулезе легких", "Сердечной астме", "Бронхиальной астме", "Крупозной пневмонии"], "correct": 3}, {"q": "В фельдшерский акушерский пункт обратился пациент с жалобами на кашель сопровождающийся выделением гнойной мокроты, повышением температуры. Болеет в течение нескольких дней, связывает свое состояние с переохлаждением. При осмотре вы обнаружили отставание правой половины груди в акте дыхания. Какой из нижеперечисленных методов обследования вы выберите для определения патологического очага в легких?", "options": ["пальпация грудной клетки", "сравнительную перкуссию", "топографическую перкуссию", "пикфлоуметрию", "эластичность грудной клетки"], "correct": 1}, {"q": "У пациента 65 лет с хроническим бронхитом «бочкообразная» грудная клетка. При проведении перкуссии легких какой перкуторный звук может определится?", "options": ["Тимпанический", "Ясный легочной", "Коробочный", "Тупой", "Притупленный"], "co let Q=[],A=[],cur=0;
const L=['A','B','C','D','E','F'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){Q=shuffle(QUESTION_BANK);A=new Array(Q.length).fill(null);cur=0;
document.getElementById('setup').style.display='none';document.getElementById('resultScreen').style.display='none';
document.getElementById('quizArea').style.display='block';document.getElementById('totalCount').textContent=Q.length;
const g=document.getElementById('navGrid');g.innerHTML='';
Q.forEach((_,i)=>{const b=document.createElement('button');b.className='navBtn';b.textContent=i+1;b.onclick=()=>{cur=i;render()};g.appendChild(b)});
render();score()}
function render(){const q=Q[cur],ans=A[cur];
document.getElementById('qIndexLabel').textContent='Вопрос '+(cur+1)+' из '+Q.length;
document.getElementById('qStatusLabel').textContent=ans!==null?'Отвечено':'Не отвечено';
document.getElementById('qText').textContent=q.q;
const list=document.getElementById('optionsList');list.innerHTML='';
q.options.forEach((t,i)=>{const d=document.createElement('div');d.className='option';
const l=document.createElement('div');l.className='letter';l.textContent=L[i];
const s=document.createElement('div');s.textContent=t;d.appendChild(l);d.appendChild(s);
if(ans!==null){d.classList.add('disabled');if(i===q.correct)d.classList.add('correct');else if(i===ans)d.classList.add('wrong')}
else d.onclick=()=>{A[cur]=i;render();score()};
list.appendChild(d)});
const fb=document.getElementById('feedback');
if(ans===null){fb.textContent='';fb.className=''}
else if(ans===q.correct){fb.textContent='✔ Верно!';fb.className='correct'}
else{fb.textContent='✘ Неверно. Правильный ответ: '+L[q.correct]+') '+q.options[q.correct];fb.className='wrong'}
document.getElementById('prevBtn').disabled=cur===0;
document.querySelectorAll('.navBtn').forEach((b,i)=>{b.className='navBtn';if(i===cur)b.classList.add('current');
if(A[i]!==null)b.classList.add(A[i]===Q[i].correct?'answered-correct':'answered-wrong')})}
function score(){document.getElementById('answeredCount').textContent=A.filter(a=>a!==null).length;
document.getElementById('correctCount').textContent=A.filter((a,i)=>a===Q[i].correct).length}
function goNext(){if(cur<Q.length-1){cur++;render()}else finishQuiz()}
function goPrev(){if(cur>0){cur--;render()}}
function finishQuiz(){const c=A.filter((a,i)=>a===Q[i].correct).length,n=A.filter(a=>a!==null).length;
document.getElementById('quizArea').style.display='none';document.getElementById('resultScreen').style.display='block';
document.getElementById('finalScoreText').textContent=c+' / '+Q.length;
document.getElementById('finalPercentText').textContent='Отвечено: '+n+' из '+Q.length+'. Правильных: '+Math.round(c/Q.length*100)+'%.'}
function reviewFromResult(){document.getElementById('resultScreen').style.display='none';document.getElementById('quizArea').style.display='block';cur=0;render()}
function restartQuiz(){startQuiz()}
</script></body></html>
